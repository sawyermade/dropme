# Example nginx config for hosting DropMe under a path prefix (e.g.
# https://example.com/dropme) alongside an existing static site, rather than
# giving it its own (sub)domain. Swap the domain, filesystem paths, and
# certbot cert paths below for your own before using this.
#
# Matching .env for the app:
#   PORT=3000
#   BASE_PATH=/dropme

server {
	server_name example.com www.example.com;

	root /var/www/example.com;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	location ~ /\.git {
		deny all;
	}

	# Proxies everything under /dropme to the DropMe app running locally on
	# port 3000 (started separately, e.g. with pm2). client_max_body_size is
	# raised from nginx's 1 MB default since this app accepts file uploads.
	location /dropme {
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		client_max_body_size 0;
	}

	listen 443 ssl; # managed by Certbot
	ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
	if ($host = example.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	if ($host = www.example.com) {
		return 301 https://$host$request_uri;
	} # managed by Certbot

	server_name example.com www.example.com;
	listen 80;
	return 404; # managed by Certbot
}
