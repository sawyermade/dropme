<!doctype html>
<!--
  Login page. Served by server.js via renderPage('login.html'), which does a
  plain string-replace of __BASE_PATH__ (and any other __VAR__ placeholders)
  before sending this file — that's why it appears in the stylesheet link and
  script tags below instead of a templating engine.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropMe — Login</title>
  <link rel="stylesheet" href="__BASE_PATH__/css/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>DropMe</h1>
    <form id="login-form">
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
      <p class="error" id="login-error" hidden></p>
    </form>
  </main>
  <script>window.BASE_PATH = "__BASE_PATH__";</script>
  <script src="__BASE_PATH__/js/login.js"></script>
</body>
</html>
