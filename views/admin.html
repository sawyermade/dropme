<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropMe — Admin</title>
  <link rel="stylesheet" href="__BASE_PATH__/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>DropMe — Admin</h1>
    <button id="logout-btn" class="link-btn" type="button">Log out</button>
  </header>
  <main class="admin">
    <section class="admin-users">
      <h2>Users</h2>

      <form id="add-user-form" class="add-user-form">
        <h3>Add user</h3>
        <label>
          Username
          <input type="text" name="username" pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, hyphens and underscores only" required>
        </label>
        <label>
          Password
          <input type="password" name="password" required>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="isAdmin">
          Admin
        </label>
        <button type="submit">Add user</button>
        <p class="error" id="add-user-error" hidden></p>
      </form>

      <details id="user-list-details" class="user-list-details">
        <summary id="user-list-summary">Users</summary>
        <ul id="user-list" class="user-list"></ul>
      </details>
    </section>

    <section class="admin-uploads">
      <h2>Uploads</h2>
      <p id="empty-msg" class="status-msg" hidden>No uploads yet.</p>
      <div id="uploads-by-user"></div>
    </section>
  </main>
  <script>window.BASE_PATH = "__BASE_PATH__";</script>
  <script src="__BASE_PATH__/js/admin.js"></script>
</body>
</html>
