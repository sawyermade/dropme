<!doctype html>
<!--
  Admin page. Served by server.js via renderPage('admin.html', { USERNAME }),
  which does a plain string-replace of __BASE_PATH__ and __USERNAME__ before
  sending this file — that's why they appear in the heading, stylesheet
  link, and script tags below instead of a templating engine. The upload box
  and share modal markup are intentionally duplicated (rather than
  shared/included) from app.html; see public/js/admin.js for the
  upload/listing/user-management/share logic.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropMe — Admin</title>
  <link rel="stylesheet" href="__BASE_PATH__/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>DropMe — Admin: __USERNAME__</h1>
    <button id="logout-btn" class="link-btn" type="button">Log out</button>
  </header>
  <main class="admin">
    <section class="admin-upload">
      <div id="dropzone" class="dropzone">
        <p>Drag &amp; drop files here, paste, or</p>
        <button id="browse-btn" class="browse-btn" type="button">Browse files</button>
        <input id="file-input" type="file" multiple hidden>
      </div>

      <ul id="file-list" class="file-list"></ul>

      <div class="actions">
        <button id="upload-btn" type="button" disabled>Upload</button>
        <div id="progress-wrap" class="progress-wrap" hidden>
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="status-msg" class="status-msg"></p>
      </div>
    </section>

    <section class="admin-users">
      <h2>Users</h2>

      <form id="add-user-form" class="add-user-form" autocomplete="off">
        <h3>Add user</h3>
        <label>
          Username
          <input type="text" name="username" pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, hyphens and underscores only" autocomplete="off" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="new-password" required>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="isAdmin">
          Admin
        </label>
        <button type="submit">Add user</button>
        <p class="error" id="add-user-error" hidden></p>
      </form>

      <details id="user-list-details" class="user-list-details">
        <summary id="user-list-summary">Users</summary>
        <ul id="user-list" class="user-list"></ul>
      </details>
    </section>

    <section class="admin-uploads">
      <h2>Uploads</h2>
      <p id="empty-msg" class="status-msg" hidden>No uploads yet.</p>
      <details id="uploads-details" class="uploads-details">
        <summary id="uploads-summary">Uploads</summary>
        <div id="uploads-by-user"></div>
      </details>
    </section>
  </main>

  <div id="share-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="share-modal-title">Share file</h3>
        <button id="share-modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <label class="toggle-row">
        <span>Public link</span>
        <input type="checkbox" id="share-toggle" class="toggle-switch">
      </label>
      <div id="share-url-row" class="share-url-row" hidden>
        <input type="text" id="share-url-input" readonly>
        <button id="share-copy-btn" class="copy-btn" type="button" title="Copy to clipboard">📋</button>
      </div>
      <p id="share-copied-msg" class="status-msg" hidden>Copied!</p>
    </div>
  </div>

  <script>window.BASE_PATH = "__BASE_PATH__";</script>
  <script src="__BASE_PATH__/js/admin.js"></script>
</body>
</html>
