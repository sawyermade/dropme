<!doctype html>
<!--
  Regular user's drop page. Served by server.js via renderPage('app.html',
  { USERNAME }), which does a plain string-replace of __BASE_PATH__ and
  __USERNAME__ before sending this file — that's why they appear in the
  heading, stylesheet link, and script tags below instead of a templating
  engine. The share modal markup near the bottom is intentionally duplicated
  (rather than shared/included) in admin.html; see public/js/app.js for the
  drag/drop/upload/share logic.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropMe</title>
  <link rel="stylesheet" href="__BASE_PATH__/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>DropMe — __USERNAME__</h1>
    <button id="logout-btn" class="link-btn" type="button">Log out</button>
  </header>
  <main class="app">
    <div id="dropzone" class="dropzone">
      <p>Drag &amp; drop files here, paste, or</p>
      <button id="browse-btn" class="browse-btn" type="button">Browse files</button>
      <input id="file-input" type="file" multiple hidden>
    </div>

    <ul id="file-list" class="file-list"></ul>

    <div class="actions">
      <button id="upload-btn" type="button" disabled>Upload</button>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="status-msg" class="status-msg"></p>
    </div>

    <section class="my-files">
      <h2>Your files</h2>
      <ul id="my-file-list" class="file-list"></ul>
      <p id="my-files-empty" class="status-msg" hidden>No files uploaded yet.</p>
    </section>
  </main>

  <div id="share-modal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="share-modal-title">Share file</h3>
        <button id="share-modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <label class="toggle-row">
        <span>Public link</span>
        <input type="checkbox" id="share-toggle" class="toggle-switch">
      </label>
      <div id="share-url-row" class="share-url-row" hidden>
        <input type="text" id="share-url-input" readonly>
        <button id="share-copy-btn" class="copy-btn" type="button" title="Copy to clipboard">📋</button>
      </div>
      <p id="share-copied-msg" class="status-msg" hidden>Copied!</p>
    </div>
  </div>

  <script>window.BASE_PATH = "__BASE_PATH__";</script>
  <script src="__BASE_PATH__/js/app.js"></script>
</body>
</html>
